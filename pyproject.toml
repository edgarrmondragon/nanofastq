[build-system]
build-backend = "scikit_build_core.build"
requires = [
  "nanobind>=2",
  "scikit-build-core>=0.10",
]

[project]
name = "nanofastq"
description = "Tiny, dependency-free FASTQ reader that exposes the Arrow PyCapsule stream interface."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = []

[dependency-groups]
dev = [
  "duckdb",
  "mypy",
  "polars",
  "pyarrow",
  "pyarrow-stubs>=20.0.0.20260819",
  "pytest",
  "pytest-codspeed>=5.0.4",
  "ty",
]

# Version comes from the latest git tag (e.g. v0.1.0); see "Releasing" in the README.
[tool.setuptools_scm]

[tool.scikit-build]
[tool.scikit-build.cmake]
build-type = "Release"
version = ">=3.28"
[tool.scikit-build.sdist]
exclude = [ ".github" ]
[tool.scikit-build.wheel]
install-dir = "nanofastq"
py-api = "cp312"
packages = [ "src/nanofastq" ]
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.uv]
cache-keys = [
  { git = { commit = true, tags = true } },
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "src/**/*.{c,h,cc}" },
]

[tool.cibuildwheel]
# One abi3 wheel (cp312-abi3) per platform covers every supported Python.
build = "cp312-*"
skip = "*-win32 *_i686"
test-command = "pytest {project}/tests"
test-requires = [ "pytest", "pyarrow", "polars", "duckdb" ]
[[tool.cibuildwheel.overrides]]
# pyarrow has no musllinux wheels, so only smoke-test the import there.
select = "*-musllinux*"
test-command = "python -c 'import nanofastq'"
test-requires = []

[tool.pyproject-fmt]
table_format = "long"

[tool.pytest]
minversion = "9"
testpaths = [ "tests" ]

[tool.tox]
env_list = [
  { prefix = "3.", start = 12, stop = 15 },
  "type",
]
[tool.tox.env.type]
description = "type check with ty"
# ty reads src/ and the _core.pyi stub directly, so nothing needs compiling.
package = "skip"
dependency_groups = [ "dev" ]
commands = [
  [ "mypy", "src", "tests" ],
  [ "ty", "check", "src", "tests" ],
]
[tool.tox.env_run_base]
description = "run tests on Python {py_dot_ver}"
dependency_groups = [ "dev" ]
commands = [ [ "pytest", { replace = "posargs", extend = true, substitute = true } ] ]
