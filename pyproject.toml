[build-system]
build-backend = "scikit_build_core.build"
requires = [
  "nanobind>=2",
  "scikit-build-core>=0.11",
]

[project]
name = "nanofastq"
description = "Tiny, dependency-free FASTQ reader that exposes the Arrow PyCapsule stream interface."
readme = "README.md"
keywords = [
  "arrow",
  "bioinformatics",
  "fastq",
  "genomics",
  "nanoarrow",
  "pyarrow",
]
license = "MIT"
license-files = [ "LICENSE", "THIRD_PARTY_NOTICES.txt" ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = []
[[project.authors]]
name = "Edgar Ramírez Mondragón"
email = "edgarrm358@gmail.com"
[project.urls]
Changelog = "https://github.com/edgarrmondragon/nanofastq/releases"
"Issue Tracker" = "https://github.com/edgarrmondragon/nanofastq/issues"
Source = "https://github.com/edgarrmondragon/nanofastq"

[dependency-groups]
dev = [
  "duckdb",
  "memray>=1.20; sys_platform!='win32'",
  "mypy",
  "polars",
  "pyarrow",
  "pyarrow-stubs>=20.0.0.20260819",
  "pytest",
  "pytest-codspeed>=5.0.4",
  "ty",
]

# Version comes from the latest git tag (e.g. v0.1.0); see "Releasing" in the README.
[tool.setuptools_scm]

[tool.scikit-build]
[tool.scikit-build.cmake]
build-type = "Release"
version = ">=3.28"
[tool.scikit-build.sdist]
exclude = [ ".github" ]
[tool.scikit-build.wheel]
install-dir = "nanofastq"
py-api = "cp312"
packages = [ "src/nanofastq" ]
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.uv]
cache-keys = [
  { git = { commit = true, tags = true } },
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "sbom.cdx.json.in" },
  { file = "src/**/*.{c,h,cc}" },
]

[tool.cibuildwheel]
build = [
  # One abi3 wheel (cp312-abi3) per platform covers every supported Python.
  "cp312-*",
  # Each Pyodide release pins one Python, so it gets one wheel per Python.
  # cp315 on Pyodide targets an alpha Pyodide (pre-release ABI, no pyarrow to test with yet).
  "cp314-pyodide_wasm32",
]
skip = "*-win32 *_i686"
test-command = "pytest {project}/tests"
test-requires = [ "pytest", "pyarrow", "polars", "duckdb" ]
[tool.cibuildwheel.pyodide]
config-settings = { "wheel.py-api" = "" }
# The venv's pytest entry-point script does not run under Pyodide's node launcher.
test-command = "python -m pytest {project}/tests"
# Pyodide's index has pyarrow (which needs pyodide-unix-timezones, not declared as a dependency)
# but not polars or duckdb; the tests that need those skip.
test-requires = [ "pytest", "pyarrow", "pyodide-unix-timezones" ]
[[tool.cibuildwheel.overrides]]
# pyarrow has no musllinux wheels, so only smoke-test the import there.
select = "*-musllinux*"
test-command = "python -c 'import nanofastq'"
test-requires = []

[tool.ruff]
required-version = ">=0.17.5"
preview = true
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "docstring-missing-returns",
  "magic-value-comparison",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
]
"benchmarks/*" = [
  "magic-value-comparison",
  "missing-return-type-private-function",
  "missing-return-type-public-function",
  "undocumented-public-function",
]
[tool.ruff.lint.flake8-copyright]
author = "Edgar Ramírez-Mondragón"
min-file-size = 40
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.pylint]
allow-dunder-method-names = [
  "__arrow_c_stream__", # https://arrow.apache.org/docs/format/CDataInterface/PyCapsuleInterface.html#arrowstream-export
]
[tool.ruff.lint]
select = [
  "complexity",
  "correctness",
  "pedantic",
  "performance",
  "style",
  "suspicious",
]
preview = true

[tool.pyproject-fmt]
table_format = "long"

[tool.mypy]
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = true

[tool.pytest]
addopts = [ "-ra" ]
filterwarnings = [ "error" ]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.tox]
requires = [
  "tox>=4.67",
]
env_list = [
  { prefix = "3.", start = 12 },
  "type",
]
[tool.tox.env.type]
description = "type check"
package = "skip"
dependency_groups = [ "dev" ]
commands = [
  [ "mypy", "src", "tests" ],
  [ "ty", "check", "src", "tests" ],
]
[tool.tox.env_run_base]
description = "run tests on Python {py_dot_ver}"
dependency_groups = [ "dev" ]
commands = [ [ "pytest", { replace = "posargs", extend = true, substitute = true } ] ]
