name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch breakage from new dependency releases (pyarrow, polars, duckdb, ...).
    - cron: "30 12 */3 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the version is derived from git tags
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp
        with:
          skip-wheel: 'true'

  build-wheel:
    name: Build wheel (${{ matrix.os }})
    needs: build-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The lowest supported Python: the abi3 wheel built here must run on all newer ones.
          python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions)[0] }}
          enable-cache: false  # no checkout here, so there is nothing to key the cache on
      - name: Build wheel from the sdist
        shell: bash
        run: uv build --wheel --out-dir wheelhouse dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    name: pytest, Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [build-package, build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Derived from the package's "Programming Language :: Python :: 3.x" classifiers.
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        # One abi3 wheel per platform, built once from the sdist on the oldest Python and
        # installed on every supported Python.
        run: uvx --with tox-uv tox run -e "$PYTHON_VERSION" --installpkg wheelhouse/*.whl
