name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch breakage from new dependency releases (pyarrow, polars, duckdb, ...).
    - cron: "30 12 */3 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp
        with:
          skip-wheel: true

  test:
    name: pytest, Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: build-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        # Derived from the package's "Programming Language :: Python :: 3.x" classifiers.
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
        include:
          # The extension is native code: also check the newest Python on the other platforms.
          - python-version: "3.15"
            os: macos-latest
          - python-version: "3.15"
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uvx --with tox-uv tox run -e "$PYTHON_VERSION"
