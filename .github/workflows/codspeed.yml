name: CodSpeed

on:
  # Only when something that can change a benchmark result is touched: the code under test, how
  # it is built, the benchmarks themselves, or this job (interpreter, runner image).
  push:
    branches: [main]
    paths:
      - src/**
      - CMakeLists.txt
      - pyproject.toml
      - benchmarks/test_perf.py
      - .github/workflows/codspeed.yml
  pull_request:
    paths:
      - src/**
      - CMakeLists.txt
      - pyproject.toml
      - benchmarks/test_perf.py
      - .github/workflows/codspeed.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write  # OIDC authentication with CodSpeed
    env:
      # CodSpeed's tracing needs the interpreter from actions/setup-python.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --python python
      - uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: simulation
          run: uv run pytest benchmarks/test_perf.py --codspeed
