name: CodSpeed

on:
  # Only when something that can change a benchmark result is touched: the code under test, how
  # it is built, the benchmarks themselves, or this job (interpreter, runner image).
  push:
    branches: [main]
    paths:
      - src/**
      - CMakeLists.txt
      - pyproject.toml
      - benchmarks/test_perf.py
      - .github/workflows/codspeed.yml
  pull_request:
    paths:
      - src/**
      - CMakeLists.txt
      - pyproject.toml
      - benchmarks/test_perf.py
      - .github/workflows/codspeed.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write  # OIDC authentication with CodSpeed
    env:
      # CodSpeed's tracing needs the interpreter from actions/setup-python.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: uv sync --python python
      - uses: CodSpeedHQ/action@v5.6.3
        with:
          mode: simulation
          run: uv run pytest benchmarks/test_perf.py --codspeed
