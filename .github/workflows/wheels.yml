name: Wheels

on:
  # Build and publish when a release is published; the tag is created with it, so there is
  # deliberately no separate tag trigger (it would build everything twice).
  release:
    types: [published]
  workflow_dispatch:
  # Only when something that can change the build is touched; ci.yml covers the rest.
  pull_request:
    paths:
      - src/**
      - CMakeLists.txt
      - pyproject.toml
      - .github/workflows/wheels.yml

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  build_wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04       # manylinux + musllinux x86_64
          - ubuntu-26.04-arm   # manylinux + musllinux aarch64
          - macos-26           # arm64
          - macos-26-intel     # x86_64
          - windows-2025       # AMD64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the version is derived from git tags
          persist-credentials: false
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-26.04
    outputs:
      package-name: ${{ steps.baipp.outputs.package_name }}
      package-version: ${{ steps.baipp.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the version is derived from git tags
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp
        with:
          skip-wheel: 'true'

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build_sdist.outputs.package-name }}/${{ needs.build_sdist.outputs.package-version }}
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      # Fetch only distributions: build-and-inspect-python-package also uploads PKG-INFO and the
      # rendered README as artifacts, and anything else in dist/ makes `twine check` fail.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages  # the sdist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
